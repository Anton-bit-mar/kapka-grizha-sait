# Публикува папката sait/ в клона gh-pages (GitHub Pages) при всяка промяна в main.
name: Публикуване в GitHub Pages
on:
  push:
    branches: [main]
    paths: ["sait/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Качване на sait/ в gh-pages
        run: |
          cp -a sait /tmp/site && touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Публикуване от ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
